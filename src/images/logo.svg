<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="set-base-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050811" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#050811" flood-opacity="0.14" />
    </filter>
    <filter id="set-gear-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090D16" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#090D16" flood-opacity="0.22" />
    </filter>

    <linearGradient id="set-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5262" />
      <stop offset="50%" stop-color="#2F3542" />
      <stop offset="100%" stop-color="#1B1F28" />
    </linearGradient>

    <linearGradient id="set-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8599" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#14171F" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="gear-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E3E8F0" />
      <stop offset="100%" stop-color="#9BA5B8" />
    </linearGradient>

    <linearGradient id="gear-dish" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#CBD3E1" />
      <stop offset="100%" stop-color="#8C96A9" />
    </linearGradient>

    <linearGradient id="gear-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="100%" stop-color="#2B3240" />
    </linearGradient>

    <linearGradient id="harmony-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#0043CA" />
    </linearGradient>
  </defs>

  <!-- Full-Canvas Squircle Base (480x480 rx=110) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#set-bg)" stroke="url(#set-border)" stroke-width="3" filter="url(#set-base-shadow)" />

  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)">
    <circle cx="256" cy="256" r="174" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <g filter="url(#set-gear-shadow)">
      <g fill="url(#gear-metal)">
        <rect x="198" y="96" width="116" height="320" rx="44" />
        <rect x="198" y="96" width="116" height="320" rx="44" transform="rotate(60 256 256)" />
        <rect x="198" y="96" width="116" height="320" rx="44" transform="rotate(120 256 256)" />
        <circle cx="256" cy="256" r="134" />
      </g>
      <circle cx="256" cy="256" r="133" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2" />
      <circle cx="256" cy="256" r="102" fill="url(#gear-dish)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="256" cy="256" r="66" fill="url(#gear-core)" stroke="#8590A6" stroke-width="2" />
      <circle cx="256" cy="256" r="42" fill="none" stroke="url(#harmony-ring)" stroke-width="14" />
      <circle cx="244" cy="244" r="6" fill="#FFFFFF" opacity="0.7" />
    </g>
  </g>
</svg>